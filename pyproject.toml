[project]
name = "comfyui-h3-drakennodes"
description = "Joint context-window (rolling window) sampling for MiniMax H3 in ComfyUI: long AV latents, footage extension via masked prefix."
version = "0.1.0"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
face-mask = ["opencv-python>=4.8", "onnxruntime>=1.20"]
person-mask = ["hydra-core>=1.3.2,<1.4", "timm==1.0.15", "iopath>=0.1.10", "tqdm>=4.66.1"]

[tool.comfy]
PublisherId = "drakenza"
DisplayName = "H3 DrakenNodes"

# ComfyUI loads the source folder itself. Editable installs only supply metadata/extras.
[tool.setuptools]
packages = []
